<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UCP | Registro DEVpapois</title>
    <style>
        :root { --primary: #004a99; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: var(--primary); margin-top: 0; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Clientes</h2>
    <input type="text" id="reg-nombre" placeholder="Nombre completo">
    <input type="text" id="reg-dni" placeholder="DNI (Sin puntos)">
    <input type="email" id="reg-email" placeholder="Correo electrónico">
    <input type="password" id="reg-pass" placeholder="Contraseña">
    <button id="btn-registrar">Registrar Usuario</button>
    <p id="mensaje"></p>
</div>

<!-- Ruta ajustada para tu estructura de carpetas -->
<script type="module" src="../src/main.ts"></script>
</body>
</html>

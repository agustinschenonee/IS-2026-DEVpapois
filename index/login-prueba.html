    <!-- Estos IDs son los que el TypeScript está buscando -->

    <input type="email" id="login-email" placeholder="ejemplo@correo.com"><br><br>

    <label>Contraseña:</label><br>
    <input type="password" id="login-pass" placeholder="Tu contraseña"><br><br>

    <button id="btn-login">Iniciar Sesión de Prueba</button>

    <p id="mensaje-login" style="font-weight: bold;"></p>

    <!-- ¡Importante! Asegurate de que la ruta apunte al archivo donde pusiste el código TypeScript de la respuesta anterior -->
    <script type="module" src="/src/login.ts"></script>

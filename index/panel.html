<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel DEVpapois</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

    <!-- 1. El código de reservas.ts va a buscar este ID para saludarte -->
    <h1 id="saludo-usuario">¡Bienvenida a DEVpapois! 🚀</h1> 

    <p>Acá van a estar los turnos y las reservas del coworking.</p>

    <!-- 2. Acá es donde se van a "dibujar" las tarjetas de Supabase -->
    <div id="lista-turnos" style="max-width: 500px; margin: 0 auto; text-align: left;">
        <p>Cargando turnos disponibles...</p>
    </div>

    <br>

    <!-- 3. Le ponemos un ID para que el script pueda borrar el localStorage al salir -->
    <button id="btn-cerrar-sesion" style="background: none; border: none; color: blue; text-decoration: underline; cursor: pointer; font-size: 1em;">
        Cerrar sesión
    </button>

    <!-- 4. LA CLAVE: Conectamos con tu lógica de TypeScript -->
    <!-- Como panel.html está en /index, subimos un nivel para ir a /src -->
    <script type="module" src="../src/reservas.ts"></script>
</body>
</html>
